<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conte General Contracting LLC | Luxury Contractor NJ</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Montserrat', sans-serif;
    background: #ffffff;
    color: #111;
}

/* NAVIGATION */
nav {
    position: fixed;
    width: 100%;
    padding: 20px 50px;
    background: rgba(255,255,255,0.95);
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 2px 20px rgba(0,0,0,0.05);
    z-index: 1000;
}

nav h2 {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    letter-spacing: 2px;
}

nav a {
    text-decoration: none;
    color: #111;
    margin-left: 25px;
    font-weight: 400;
}

nav a:hover {
    color: #c6a75e;
}

/* HERO */
.hero {
    height: 90vh;
    background: url("https://via.placeholder.com/1200x800") center/cover no-repeat;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
}

.hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.55);
}

.hero-content {
    position: relative;
    max-width: 800px;
}

.hero h1 {
    font-family: 'Playfair Display', serif;
    font-size: 50px;
    margin: 0;
}

.hero p {
    font-size: 18px;
    margin-top: 20px;
}

.btn {
    display: inline-block;
    margin-top: 30px;
    padding: 14px 34px;
    border: 1px solid #c6a75e;
    color: #111;
    text-decoration: none;
    transition: 0.3s;
}

.btn:hover {
    background: #c6a75e;
    color: #fff;
}

/* SECTIONS */
section {
    padding: 100px 20px;
    max-width: 1200px;
    margin: auto;
    text-align: center;
}

section h2 {
    font-family: 'Playfair Display', serif;
    font-size: 40px;
    margin-bottom: 30px;
}

.image-block {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
    align-items: center;
    margin-top: 40px;
}

.image-block img {
    width: 100%;
    height: 400px;
    object-fit: cover;
}

.image-block p {
    font-size: 18px;
    line-height: 1.8;
}

/* TESTIMONIAL */
.testimonial-section {
    background: #f7f7f7;
    padding: 80px 20px;
}

.testimonial {
    font-size: 22px;
    max-width: 800px;
    margin: auto;
    opacity: 0;
    transition: opacity 1s ease;
}

.testimonial.show {
    opacity: 1;
}

.testimonial-author {
    margin-top: 15px;
    color: #c6a75e;
    font-weight: 500;
}

/* FOOTER */
footer {
